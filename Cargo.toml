[workspace]

[package]
name = "parket"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/oonid/parket"
description = "Universal MariaDB to Delta Lake Extractor"

[dependencies]
connector_arrow = { path = "vendor/connector_arrow/connector_arrow", features = ["src_mysql"] }
deltalake = { version = "0.32", features = ["s3", "datafusion"] }
mysql = "28"
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio", "macros"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
openssl = { version = "0.10", features = ["vendored"] }
sha2 = "0.10"
url = "2.5.8"
object_store = { version = "0.12", features = ["aws"] }

[dev-dependencies]
aws-sdk-s3 = "1"
futures = "0.3"
mockall = "0.14"
serial_test = "3"
tempfile = "3"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["mariadb", "minio"] }
