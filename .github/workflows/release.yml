name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: parket

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --locked

      - name: Build with cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          mv target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} \
             target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}-${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}-${{ matrix.target }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Package binaries into per-target tar.gz + checksums
        run: |
          cd artifacts
          # Version from the tag (v0.2.1 -> 0.2.1); the archive name carries the version and
          # target, but the binary INSIDE stays a plain version-less `parket`.
          VERSION="${GITHUB_REF_NAME#v}"
          PREFIX="${BINARY_NAME}-"
          # Snapshot the raw per-target binaries BEFORE any tarball exists (so the glob below
          # can't re-match a just-created .tar.gz).
          mapfile -t BINS < <(ls "${BINARY_NAME}"-*)
          for f in "${BINS[@]}"; do
            target="${f#$PREFIX}"                 # e.g. x86_64-unknown-linux-musl
            cp "$f" "${BINARY_NAME}"              # binary itself: no version, no target
            chmod +x "${BINARY_NAME}"
            tar -czf "${BINARY_NAME}-${VERSION}-${target}.tar.gz" "${BINARY_NAME}"
            rm -f "${BINARY_NAME}"
          done
          sha256sum "${BINARY_NAME}"-*.tar.gz > checksums-sha256.txt
          echo "## SHA256 Checksums (tar.gz)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat checksums-sha256.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/${{ env.BINARY_NAME }}-*.tar.gz
            artifacts/checksums-sha256.txt

  docker:
    name: Publish Docker image to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download musl binaries
        uses: actions/download-artifact@v4
        with:
          pattern: parket-*-musl
          path: artifacts
          merge-multiple: true

      - name: Rename binaries for Dockerfile
        run: |
          mv artifacts/parket-x86_64-unknown-linux-musl artifacts/parket-amd64-unknown-linux-musl
          mv artifacts/parket-aarch64-unknown-linux-musl artifacts/parket-arm64-unknown-linux-musl
          chmod +x artifacts/parket-*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/oonid/parket:latest
            ghcr.io/oonid/parket:${{ steps.meta.outputs.VERSION }}
